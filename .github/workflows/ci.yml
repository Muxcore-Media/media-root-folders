name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  REGISTRY: ghcr.io
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
          repository: Muxcore-Media/core
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-root-folders
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - working-directory: ./media-root-folders
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
          repository: Muxcore-Media/core
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-root-folders
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - working-directory: ./media-root-folders
        run: go test -race -count=1 -timeout 10m ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
          repository: Muxcore-Media/core
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-root-folders
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - working-directory: ./media-root-folders
        run: |
          go build -o /dev/null ./cmd/module
          go vet ./...
