syntax = "proto3";
package muxcore.roots.v1;
option go_package = "github.com/Muxcore-Media/media-root-folders/proto/rootsv1;rootsv1";

service RootFolderService {
  rpc ListRoots(ListRootsRequest) returns (ListRootsResponse);
  rpc CreateRoot(CreateRootRequest) returns (CreateRootResponse);
  rpc UpdateRoot(UpdateRootRequest) returns (UpdateRootResponse);
  rpc DeleteRoot(DeleteRootRequest) returns (DeleteRootResponse);
  rpc SeedFromPaths(SeedFromPathsRequest) returns (SeedFromPathsResponse);
  rpc ProbeRoot(ProbeRootRequest) returns (ProbeRootResponse);
  rpc BrowsePath(BrowsePathRequest) returns (BrowsePathResponse);
}

message RootFolder {
  string id = 1;
  string path = 2;
  string name = 3;
  string media_kind = 4; // "movies" | "tv" | "any"
  string created_at = 5;
  string updated_at = 6;
  bool accessible = 7;
  int64 free_bytes = 8;
  int64 total_bytes = 9;
  string naming_template_id = 10;
}

message ListRootsRequest {
  string media_kind = 1; // optional filter; empty = all
}

message ListRootsResponse {
  repeated RootFolder roots = 1;
}

message CreateRootRequest {
  string path = 1;
  string name = 2;
  string media_kind = 3; // default "any"
  string naming_template_id = 4;
}

message CreateRootResponse {
  RootFolder root = 1;
}

message UpdateRootRequest {
  string id = 1;
  string path = 2;
  string name = 3;
  string media_kind = 4;
  string naming_template_id = 5;
}

message UpdateRootResponse {
  RootFolder root = 1;
}

message DeleteRootRequest {
  string id = 1;
}

message DeleteRootResponse {}

message SeedFromPathsRequest {
  repeated string paths = 1;
  string media_kind = 2; // applied to newly created roots; default "any"
}

message SeedFromPathsResponse {
  repeated RootFolder created = 1;
  repeated RootFolder existing = 2;
}

message ProbeRootRequest {
  string path = 1;
}

message ProbeRootResponse {
  string path = 1;
  bool accessible = 2;
  int64 free_bytes = 3;
  int64 total_bytes = 4;
  string error = 5;
}

message BrowsePathRequest {
  string path = 1; // empty = platform root (/)
}

message BrowseEntry {
  string name = 1;
  string path = 2;
  bool is_dir = 3;
}

message BrowsePathResponse {
  string path = 1;
  string parent = 2;
  repeated BrowseEntry entries = 3;
}
